<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Formulários</h1>

  <form action="cadastro.php" method="get" autocomplete="on">
    <div>
      <label for="nome">Nome:</label>
      <input type="text" name="nome" id="nome" autocomplete="name" minlength="3" maxlength="20" required placeholder="Nome completo">
    </div>

    <div>
      <label for="media">Média:</label>
      <input type="number" name="media" id="media" min="0" max="10" step="0.1" required value="5">
    </div>

    <div>
      <label for="periodo">Periodo Letivo</label>
      <input type="month" name="periodo" id="periodo" value="2025-10">
    </div>

    <div>
      <label for="ano">Ano</label>
      <input type="date" name="ano" id="ano" value="2025-12-05">
    </div>

    <div>
      <label for="hora">Hora</label>
      <input type="time" name="hora" id="hora" value="05:30">
    </div>

    <div>
      <button type="submit">Enviar</button>
      <button type="reset">Reset</button>
    </div>
  </form>
</body>
</html>
