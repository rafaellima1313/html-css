<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Formulários</h1>

  <form action="cadastro.php" method="post" autocomplete="on">

    <div>
      <label for="estados">Estado:</label>
      <select name="estados" id="estados">

        <option value="">-- Escolha --</option>
        
        <optgroup label="Sudeste">
          <option value="SP">São Paulo</option>
          <option value="RJ">Rio de Janeiro</option>
          <option value="MG">Minas Gerais</option>
          <option value="ES">Espirito Santo</option>
        </optgroup>

        <optgroup label="Sul">
          <option value="SC">Santa Catarina</option>
          <option value="PR">Paraná</option>
          <option value="RS">Rio Grande do Sul</option>
        </optgroup>
      </select>
    </div>

    <div>
      <label for="bandas">Bandas:</label>
      <input type="text" name="bandas" id="bandas" list="lista">

      <datalist id="lista">
        <option>Iron Maiden</option>
        <option>Kiss</option>
        <option>Judas Priest</option>
        <option>Manowar</option>
      </datalist>
    </div>

    <div>
      <label for="mensagem">Mensagem:</label><br>
      <textarea name="mensagem" id="mensagem" rows="10" cols="30"></textarea>
    </div>

    <div>
      <button type="submit">Enviar</button>
      <button type="reset">Limpar</button>
    </div>
  </form>
</body>
</html>
